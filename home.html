<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayan Trading Terminal</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #131722;
            color: #d1d4dc;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Үстүңкү панель (Header) */
        .header {
            height: 48px;
            background-color: #1e222d;
            border-bottom: 1px solid #2a2e39;
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 12px;
        }

        .symbol-btn {
            background-color: #2a2e39;
            color: #f0b90b;
            border: 1px solid #363c4e;
            padding: 6px 14px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .symbol-btn:hover, .symbol-btn.active {
            background-color: #2962ff;
            color: #fff;
            border-color: #2962ff;
        }

        /* Негизги мазмун: График жана редактор */
        .main-container {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        #chart-container {
            flex: 1;
            width: 100%;
            position: relative;
        }

        /* Төмөнкү код редактор панели */
        .editor-panel {
            height: 220px;
            background-color: #1e222d;
            border-top: 2px solid #2a2e39;
            display: flex;
            flex-direction: column;
        }

        .editor-header {
            height: 36px;
            background-color: #131722;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            font-size: 13px;
            color: #787b86;
        }

        .run-btn {
            background-color: #089981;
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .run-btn:hover { background-color: #067a67; }

        #code-editor {
            flex: 1;
            background-color: #1e222d;
            color: #d1d4dc;
            border: none;
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            resize: none;
            outline: none;
        }
    </style>
</head>
<body>

    <!-- Үстүңкү панель: Активдерди тандоо -->
    <div class="header">
        <button class="symbol-btn active" onclick="switchSymbol('BTCUSD')">BTC/USD</button>
        <button class="symbol-btn" onclick="switchSymbol('XAUUSD')">XAU/USD (Алтын)</button>
        <span id="current-symbol-title" style="margin-left: auto; font-weight: bold; color: #2962ff;">BTCUSD</span>
    </div>

    <!-- Негизги график -->
    <div class="main-container">
        <div id="chart-container"></div>

        <!-- Код жазуу панели (Pine Script ордуна JS) -->
        <div class="editor-panel">
            <div class="editor-header">
                <span>Индикатор редактору (JavaScript Коду)</span>
                <button class="run-btn" onclick="runCustomIndicator()">Индикаторду Кошуу</button>
            </div>
            <textarea id="code-editor" placeholder="// Индикатор кодун ушул жерге жазыңыз
// Мисалы (SMA 3-мезгил):
const smaData = [];
for (let i = 2; i < candles.length; i++) {
    const avg = (candles[i].close + candles[i-1].close + candles[i-2].close) / 3;
    smaData.push({ time: candles[i].time, value: avg });
}
const smaSeries = chart.addLineSeries({ color: '#f0b90b', lineWidth: 2 });
smaSeries.setData(smaData);
"></textarea>
        </div>
    </div>

    <script>
        let currentSymbol = 'BTCUSD';
        let candles = [];
        let indicatorSeriesList = [];

        // 1. Графикти түзүү (TradingView Dark Style)
        const chartElement = document.getElementById('chart-container');
        const chart = LightweightCharts.createChart(chartElement, {
            layout: {
                backgroundColor: '#131722',
                textColor: '#d1d4dc',
            },
            grid: {
                vertLines: { color: '#2a2e39' },
                horzLines: { color: '#2a2e39' },
            },
            timeScale: { borderColor: '#2a2e39' },
        });

        const candleSeries = chart.addCandlestickSeries({
            upColor: '#089981',
            downColor: '#f23645',
            borderVisible: false,
            wickUpColor: '#089981',
            wickDownColor: '#f23645',
        });

        // 2. Python Серверден маалымат алуу
        async function fetchCandles(symbol) {
            try {
                // Серверге активдин атын жөнөтөбүз
                const response = await fetch(`http://127.0.0.1:8000/api/candles?symbol=${symbol}`);
                if (!response.ok) throw new Error('Серверден ката келди');
                candles = await response.json();
                candleSeries.setData(candles);
            } catch (err) {
                console.warn('Python серверге туташпады, тесттик маалыматтар колдонулууда');
                // Сервер өчүк болсо убактылуу тест маалымат:
                candles = [
                    { time: '2026-11-01', open: 2700, high: 2720, low: 2690, close: 2715 },
                    { time: '2026-11-02', open: 2715, high: 2740, low: 2710, close: 2730 },
                    { time: '2026-11-03', open: 2730, high: 2735, low: 2680, close: 2695 },
                    { time: '2026-11-04', open: 2695, high: 2725, low: 2690, close: 2720 },
                    { time: '2026-11-05', open: 2720, high: 2750, low: 2715, close: 2745 },
                ];
                candleSeries.setData(candles);
            }
        }

        // 3. Активди которуу функциясы
        function switchSymbol(symbol) {
            currentSymbol = symbol;
            document.getElementById('current-symbol-title').innerText = symbol;
            
            // Баскычтардын стилин жаңыртуу
            document.querySelectorAll('.symbol-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.includes(symbol.slice(0, 3)));
            });

            fetchCandles(symbol);
        }

        // 4. Төмөнкү код редакторундагы индикатор кодун иштетүү
        function runCustomIndicator() {
            const userCode = document.getElementById('code-editor').value;
            try {
                // Кодду коопсуз иштетүү
                const runCode = new Function('chart', 'candles', userCode);
                runCode(chart, candles);
            } catch (e) {
                alert('Индикатор кодунда ката бар: ' + e.message);
            }
        }

        // Экран өлчөмү өзгөргөндө графикти тууралоо
        window.addEventListener('resize', () => {
            chart.resize(chartElement.clientWidth, chartElement.clientHeight);
        });

        // Баштапкы жүктөлүшү
        fetchCandles(currentSymbol);
    </script>
</body>
</html>
