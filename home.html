<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayan Trading Terminal</title>
    <!-- Lightweight Charts кітапханасы -->
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #131722;
            color: #d1d4dc;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        /* Үстүңкү панель */
        .header {
            height: 48px;
            background-color: #1e222d;
            border-bottom: 1px solid #2a2e39;
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 12px;
        }

        .symbol-btn {
            background-color: #2a2e39;
            color: #f0b90b;
            border: 1px solid #363c4e;
            padding: 6px 14px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .symbol-btn:hover, .symbol-btn.active {
            background-color: #2962ff;
            color: #fff;
            border-color: #2962ff;
        }

        /* График орналасқан аймақ */
        #chart-container {
            width: 100%;
            height: calc(100vh - 268px);
            position: relative;
            background-color: #131722;
        }

        /* Төменгі код редактор панели */
        .editor-panel {
            height: 220px;
            background-color: #1e222d;
            border-top: 2px solid #2a2e39;
            display: flex;
            flex-direction: column;
        }

        .editor-header {
            height: 36px;
            background-color: #131722;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            font-size: 13px;
            color: #787b86;
        }

        .run-btn {
            background-color: #089981;
            color: white;
            border: none;
            padding: 5px 14px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .run-btn:hover { background-color: #067a67; }

        #code-editor {
            flex: 1;
            background-color: #1e222d;
            color: #d1d4dc;
            border: none;
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            resize: none;
            outline: none;
        }
    </style>
</head>
<body>

    <!-- Активтерді ауыстыру батырмалары -->
    <div class="header">
        <button class="symbol-btn active" onclick="switchSymbol('BTCUSD')">BTC/USD</button>
        <button class="symbol-btn" onclick="switchSymbol('XAUUSD')">XAU/USD (Алтын)</button>
        <span id="current-symbol-title" style="margin-left: auto; font-weight: bold; color: #2962ff;">BTCUSD</span>
    </div>

    <!-- График шығатын контейнер -->
    <div id="chart-container"></div>

    <!-- Индикатор жазатын редактор -->
    <div class="editor-panel">
        <div class="editor-header">
            <span>Индикатор редактору (JavaScript коду)</span>
            <button class="run-btn" onclick="runCustomIndicator()">Индикаторды қосу</button>
        </div>
        <textarea id="code-editor" placeholder="// Индикатор кодын осында жазыңыз
// Мысалы (SMA 3):
const smaData = [];
for (let i = 2; i < candles.length; i++) {
    const avg = (candles[i].close + candles[i-1].close + candles[i-2].close) / 3;
    smaData.push({ time: candles[i].time, value: avg });
}
const smaSeries = chart.addLineSeries({ color: '#f0b90b', lineWidth: 2 });
smaSeries.setData(smaData);
"></textarea>
    </div>

    <script>
        let currentSymbol = 'BTCUSD';
        
        // Нарық деректері (Свечалар)
        const marketData = {
            'BTCUSD': [
                { time: '2026-11-01', open: 68000, high: 69500, low: 67500, close: 69000 },
                { time: '2026-11-02', open: 69000, high: 71000, low: 68500, close: 70500 },
                { time: '2026-11-03', open: 70500, high: 70800, low: 69000, close: 69800 },
                { time: '2026-11-04', open: 69800, high: 72000, low: 69500, close: 71800 },
                { time: '2026-11-05', open: 71800, high: 73500, low: 71200, close: 73000 },
                { time: '2026-11-06', open: 73000, high: 74200, low: 72500, close: 74000 }
            ],
            'XAUUSD': [
                { time: '2026-11-01', open: 2710, high: 2730, low: 2700, close: 2725 },
                { time: '2026-11-02', open: 2725, high: 2745, low: 2720, close: 2740 },
                { time: '2026-11-03', open: 2740, high: 2750, low: 2710, close: 2715 },
                { time: '2026-11-04', open: 2715, high: 2735, low: 2710, close: 2730 },
                { time: '2026-11-05', open: 2730, high: 2760, low: 2725, close: 2755 },
                { time: '2026-11-06', open: 2755, high: 2780, low: 2750, close: 2775 }
            ]
        };

        let candles = marketData[currentSymbol];

        const container = document.getElementById('chart-container');

        // TradingView стиліндегі қара график дизайнын жасау
        const chart = LightweightCharts.createChart(container, {
            width: container.clientWidth,
            height: container.clientHeight,
            layout: {
                backgroundColor: '#131722',
                textColor: '#d1d4dc',
                attributionLogo: false, // TV логотипін өшіру
            },
            grid: {
                vertLines: { color: '#2a2e39' },
                horzLines: { color: '#2a2e39' },
            },
            timeScale: {
                borderColor: '#2a2e39',
                timeVisible: true,
            },
        });

        // Свеча сериясын қосу (Жасыл және Қызыл түстер)
        const candleSeries = chart.addCandlestickSeries({
            upColor: '#089981',
            downColor: '#f23645',
            borderVisible: false,
            wickUpColor: '#089981',
            wickDownColor: '#f23645',
        });

        candleSeries.setData(candles);

        // Активті ауыстыру функциясы (BTC пен XAUUSD)
        function switchSymbol(symbol) {
            currentSymbol = symbol;
            document.getElementById('current-symbol-title').innerText = symbol;
            
            document.querySelectorAll('.symbol-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.includes(symbol.slice(0, 3)));
            });

            candles = marketData[symbol];
            candleSeries.setData(candles);
            chart.timeScale().fitContent();
        }

        // Пайдаланушы жазған индикатор кодын іске қосу
        function runCustomIndicator() {
            const userCode = document.getElementById('code-editor').value;
            try {
                const runCode = new Function('chart', 'candles', userCode);
                runCode(chart, candles);
            } catch (e) {
                alert('Индикатор кодунда ката бар: ' + e.message);
            }
        }

        // Экран өлшемі өзгенде графикті автоматты түрде бейімдеу
        window.addEventListener('resize', () => {
            chart.resize(container.clientWidth, container.clientHeight);
        });

        // Бастапқыда график масштабын туралау
        chart.timeScale().fitContent();
    </script>
</body>
</html>
