<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayan Trading Platform</title>
    <!-- TradingView Lightweight Charts Кітапханасы -->
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            background-color: #131722;
            overflow: hidden;
        }
        #chart {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="chart"></div>

    <script>
        // 1. Графикті құру
        const chart = LightweightCharts.createChart(document.getElementById('chart'), {
            layout: {
                backgroundColor: '#131722',
                textColor: '#d1d4dc',
            },
            grid: {
                vertLines: { color: '#2B2B43' },
                horzLines: { color: '#2B2B43' },
            },
            timeScale: {
                timeVisible: true,
                secondsVisible: false,
            },
        });

        // 2. Жапон шамдарын (Candlesticks) қосу
        const candleSeries = chart.addCandlestickSeries({
            upColor: '#26a69a',
            downColor: '#ef5350',
            borderVisible: false,
            wickUpColor: '#26a69a',
            wickDownColor: '#ef5350',
        });

        // Тестілік баға деректері
        const data = [
            { time: '2026-10-01', open: 100, high: 110, low: 95, close: 105 },
            { time: '2026-10-02', open: 105, high: 115, low: 100, close: 110 },
            { time: '2026-10-03', open: 110, high: 120, low: 105, close: 108 },
            { time: '2026-10-04', open: 108, high: 125, low: 106, close: 120 },
            { time: '2026-10-05', open: 120, high: 130, low: 118, close: 125 },
        ];
        candleSeries.setData(data);

        // 3. ӨЗІҢІЗДІҢ ЖЕКЕ ИНДИКАТОРЫҢЫЗДЫ ҚОСУ
        const lineSeries = chart.addLineSeries({
            color: '#2962FF',
            lineWidth: 2,
        });

        // Баға негізінде индикатор формуласын есептеу (мысалы: орташа баға сызығы)
        const indicatorData = data.map(item => ({
            time: item.time,
            value: (item.high + item.low) / 2 // Өзіңіздің кез келген математикалық формулаңыз
        }));

        lineSeries.setData(indicatorData);
    </script>
</body>
</html>
