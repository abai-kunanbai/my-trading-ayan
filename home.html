<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayan Trading Platform</title>
    <!-- Lightweight Charts Кітапханасы -->
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            background-color: #131722;
            color: #d1d4dc;
            font-family: Arial, sans-serif;
            display: flex;
            overflow: hidden;
        }
        #sidebar {
            width: 340px;
            background-color: #1e222d;
            border-right: 1px solid #2a2e39;
            display: flex;
            flex-direction: column;
            padding: 15px;
            gap: 12px;
            z-index: 10;
        }
        h2 { font-size: 18px; margin: 0 0 5px 0; color: #2962FF; }
        .section-title { font-size: 13px; font-weight: bold; margin-top: 5px; color: #848e9c; }
        
        .btn-group { display: flex; gap: 5px; flex-wrap: wrap; }
        .asset-btn, .tf-btn {
            flex: 1;
            padding: 8px;
            background-color: #2a2e39;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }
        .asset-btn.active, .tf-btn.active { background-color: #2962FF; }

        #codeEditor {
            width: 100%;
            height: 120px;
            background-color: #131722;
            color: #00ffcc;
            border: 1px solid #2a2e39;
            border-radius: 4px;
            padding: 8px;
            font-family: monospace;
            font-size: 12px;
            resize: none;
        }
        .apply-btn {
            padding: 10px;
            background-color: #26a69a;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .apply-btn:hover { background-color: #2bbbad; }

        #chart-container {
            flex: 1;
            height: 100%;
            position: relative;
            background-color: #131722;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>Ayan Terminal</h2>
        
        <div class="section-title">Активті таңдаңыз:</div>
        <div class="btn-group">
            <button class="asset-btn active" id="btnBtc" onclick="changeAsset('BTC')">BTC/USD</button>
            <button class="asset-btn" id="btnGold" onclick="changeAsset('GOLD')">XAU/USD</button>
        </div>

        <div class="section-title">Таймфрейм:</div>
        <div class="btn-group">
            <button class="tf-btn" onclick="changeTf('1m')">1m</button>
            <button class="tf-btn" onclick="changeTf('15m')">15m</button>
            <button class="tf-btn" onclick="changeTf('1h')">1h</button>
            <button class="tf-btn active" onclick="changeTf('1D')">1D</button>
        </div>

        <div class="section-title">Индикатор коды (JS формуласы):</div>
        <textarea id="codeEditor">return (item.high + item.low) / 2;</textarea>
        <button class="apply-btn" onclick="applyIndicator()">Индикаторды қосу (Run)</button>
    </div>

    <div id="chart-container"></div>

    <script>
        const chartContainer = document.getElementById('chart-container');
        
        // Графикті құру және мышқамен масштабтау/жылжытуды қосу
        const chart = LightweightCharts.createChart(chartContainer, {
            layout: { 
                background: { type: 'solid', color: '#131722' }, 
                textColor: '#d1d4dc' 
            },
            grid: { 
                vertLines: { color: '#2b2b43' }, 
                horzLines: { color: '#2b2b43' } 
            },
            timeScale: { 
                timeVisible: true, 
                secondsVisible: false 
            },
            handleScroll: {
                mouseWheel: true,
                pressedMouseMove: true,
            },
            handleScale: {
                axisPressedMouseMove: true,
                mouseWheel: true,
                pinch: true,
            },
        });

        // Свечалар: Өскенде - жасыл, Түскенде - қызыл
        const candleSeries = chart.addCandlestickSeries({
            upColor: '#26a69a',
            downColor: '#ef5350',
            borderVisible: false,
            wickUpColor: '#26a69a',
            wickDownColor: '#ef5350'
        });

        const lineSeries = chart.addLineSeries({ 
            color: '#2962FF', 
            lineWidth: 2 
        });

            { time: '2026-11-04', open: 67500, high: 70000, low: 67000, close: 69500 },

        ];

            { time: '2026-11-02', open: 4080, high: 4120, low: 4060, close: 4110 },
            { time: '2026-11-03', open: 4110, high: 4150, low: 4090, close: 4100 },
            { time: '2026-11-04', open: 4100, high: 4160, low: 4100, close: 4140 },
            { time: '2026-11-05', open: 4140, high: 4190, low: 4130, close: 4170 },
        ];

        let currentData = btcData;
        candleSeries.setData(currentData);
        applyIndicator();

            document.getElementById('btnBtc').classList.remove('active');
            document.getElementById('btnGold').classList.remove('active');
