<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayan Trading Platform</title>
    <!-- Lightweight Charts кітапханасының сенімді нұсқасы -->
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            background-color: #131722;
            color: #d1d4dc;
            font-family: Arial, sans-serif;
            display: flex;
            overflow: hidden;
        }
        #sidebar {
            width: 320px;
            background-color: #1e222d;
            border-right: 1px solid #2a2e39;
            display: flex;
            flex-direction: column;
            padding: 15px;
            gap: 15px;
            z-index: 10;
        }
        h2 { font-size: 18px; margin: 0 0 10px 0; color: #2962FF; }
        .section-title { font-size: 14px; font-weight: bold; margin-bottom: 5px; }
        .btn-group { display: flex; gap: 10px; }
        .asset-btn {
            flex: 1; padding: 10px; background-color: #2a2e39; color: #fff;
            border: none; border-radius: 4px; cursor: pointer; font-weight: bold;
        }
        .asset-btn.active { background-color: #2962FF; }
        #codeEditor {
            width: 100%; height: 150px; background-color: #131722; color: #00ffcc;
            border: 1px solid #2a2e39; border-radius: 4px; padding: 10px;
            font-family: monospace; font-size: 12px; resize: none;
        }
        .apply-btn {
            padding: 10px; background-color: #26a69a; color: white;
            border: none; border-radius: 4px; cursor: pointer; font-weight: bold;
        }
        #chart-container {
            flex: 1; height: 100%; position: relative; background-color: #131722;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>Ayan Terminal</h2>
        <div class="section-title">Активті таңдаңыз:</div>
        <div class="btn-group">
            <button class="asset-btn active" id="btnBtc" onclick="changeAsset('BTC')">BTC/USD</button>
            <button class="asset-btn" id="btnGold" onclick="changeAsset('GOLD')">XAU/USD</button>
        </div>
        <div class="section-title">Индикатор коды (JS):</div>
        <textarea id="codeEditor">return (item.high + item.low) / 2;</textarea>
        <button class="apply-btn" onclick="applyIndicator()">Индикаторды қосу (Run)</button>
    </div>

    <div id="chart-container"></div>

    <script>
        const chartContainer = document.getElementById('chart-container');
        const chart = LightweightCharts.createChart(chartContainer, {
            layout: { background: { type: 'solid', color: '#131722' }, textColor: '#d1d4dc' },
            grid: { vertLines: { color: '#2b2b43' }, horzLines: { color: '#2b2b43' } },
            timeScale: { timeVisible: true },
        });

        const candleSeries = chart.addCandlestickSeries({
            upColor: '#26a69a', downColor: '#ef5350', borderVisible: false,
            wickUpColor: '#26a69a', wickDownColor: '#ef5350'
        });

        const lineSeries = chart.addLineSeries({ color: '#2962FF', lineWidth: 2 });

        const btcData = [
            { time: '2026-11-01', open: 65000, high: 67000, low: 64000, close: 66000 },
            { time: '2026-11-02', open: 66000, high: 68500, low: 65500, close: 68000 },
            { time: '2026-11-03', open: 68000, high: 69000, low: 67000, close: 67500 },
            { time: '2026-11-04', open: 67500, high: 70000, low: 67000, close: 69500 },
            { time: '2026-11-05', open: 69500, high: 71000, low: 69000, close: 70500 },
        ];

        const goldData = [
            { time: '2026-11-01', open: 4050, high: 4100, low: 4030, close: 4080 },
            { time: '2026-11-02', open: 4080, high: 4120, low: 4060, close: 4110 },
            { time: '2026-11-03', open: 4110, high: 4150, low: 4090, close: 4100 },
            { time: '2026-11-04', open: 4100, high: 4160, low: 4100, close: 4140 },
            { time: '2026-11-05', open: 4140, high: 4190, low: 4130, close: 4170 },
        ];

        let currentData = btcData;
        candleSeries.setData(currentData);
        applyIndicator();

        function changeAsset(asset) {
            document.getElementById('btnBtc').classList.remove('active');
            document.getElementById('btnGold').classList.remove('active');
            if (asset === 'BTC') {
                currentData = btcData;
                document.getElementById('btnBtc').classList.add('active');
            } else {
                currentData = goldData;
                document.getElementById('btnGold').classList.add('active');
            }
            candleSeries.setData(currentData);
            applyIndicator();
        }

        function applyIndicator() {
            try {
                const userCode = document.getElementById('codeEditor').value;
                const customFormula = new Function('item', userCode);
                const indicatorResult = currentData.map(item => ({
                    time: item.time,
                    value: customFormula(item)
                }));
                lineSeries.setData(indicatorResult);
            } catch (error) {
                alert('Қате: ' + error.message);
            }
        }

        window.addEventListener('resize', () => {
            chart.applyOptions({ width: chartContainer.clientWidth, height: chartContainer.clientHeight });
        });
    </script>
</body>
</html>
